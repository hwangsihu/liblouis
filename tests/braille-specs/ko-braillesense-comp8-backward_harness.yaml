  - ["⢐", ","]
  - ["⠤", "-"]
  - ["⢲", "."]
  - ["⢌", "/"]
  - ["⢐⢂", ":"]
  - ["⢰⢆", ";"]
  - ["⢣", "<"]
  - ["⢒⢒", "="]
  - ["⢜", ">"]
  - ["⡦", "?"]
  - ["⢈", "@"]
  - ["⢦⢆", "["]
  - ['⢡', '\\']
