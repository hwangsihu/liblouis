  - - "9~10"
    - ⠼⠊⠈⠔⠼⠁⠚

  # 2024 개정 — 제14절 기타 부호
  - - "제2 〃"
    - ⠨⠝⠼⠃ ⠴⠴
  - - "밤ː나무"
    - ⠘⠢⠠⠄⠉⠑⠍
