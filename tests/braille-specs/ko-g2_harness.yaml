    - ⠫⠐⠆⠉⠣
  - - "음…"
    - ⠭⠠⠠⠠
  - - "음..."
    - ⠭⠲⠲⠲
  - - "“예”"
    - ⠦⠝⠴
  - - "‘예’"
    - ⠠⠦⠝⠴⠄
  - - "(가)"
    - ⠦⠄⠫⠠⠴
  - - "[가]"
    - ⠦⠆⠫⠰⠴
  - - "{가}"
    - ⠦⠂⠫⠐⠴
  - - "『가』"
