display: unicode-without-blank.dis
table:
  language: ko
  grade: 2
  __assert-match: ko-g2.ctb
tests:
  - - 2000년
    - ⠼⠃⠚⠚⠚ ⠉⠡
  - - unity
    - ⠥⠝⠰⠽

  - - "끝."
    - ⠈⠳⠞⠲
    - {xfail: true}
  - - "왜?"
    - ⠧⠗⠦
    - {xfail: true}
  - - "야!"
    - ⠜⠖
  - - "가, 나"
    - ⠫⠐ ⠉⠣
  - - "가·나"
    - ⠫⠐⠆⠉⠣
  - - "음…"
    - ⠭⠠⠠⠠
  - - "음..."
    - ⠭⠲⠲⠲
  - - "“예”"
    - ⠦⠝⠴
  - - "‘예’"
    - ⠠⠦⠝⠴⠄
  - - "(가)"
    - ⠦⠄⠫⠠⠴
  - - "[가]"
    - ⠦⠆⠫⠰⠴
  - - "{가}"
    - ⠦⠂⠫⠐⠴
  - - "『가』"
    - ⠰⠦⠫⠴⠆
  - - "「가」"
    - ⠐⠦⠫⠴⠂
  - - "《가》"
    - ⠰⠶⠫⠶⠆
  - - "〈가〉"
    - ⠐⠶⠫⠶⠂
  - - "가—나"
    - ⠫⠤⠤⠉⠣
  - - "9월∼10월"
    - ⠼⠊⠏⠂⠈⠔⠼⠁⠚⠏⠂
  - - "9~10"
    - ⠼⠊⠈⠔⠼⠁⠚

  - - "제2 〃"
    - ⠨⠝⠼⠃ ⠴⠴
  - - "밤ː나무"
    - ⠘⠢⠠⠄⠉⠑⠍
  - - "가 → 나"
    - ⠫ ⠒⠕ ⠉⠣
  - - "^^"
    - ⠈⠢⠈⠢
  - - "_가_"
    - ⠸⠤⠫⠸⠤
  - - "@a"
    - ⠈⠁⠁

  # 제45항 연산·비교 기호
  - - "5+7=12"
    - ⠼⠑⠢⠼⠛⠒⠒⠼⠁⠃
  - - "4×8=32"
    - ⠼⠙⠡⠼⠓⠒⠒⠼⠉⠃
  - - "12÷3=4"
    - ⠼⠁⠃⠌⠌⠼⠉⠒⠒⠼⠙
  - - "7>5"
    - ⠼⠛⠢⠢⠼⠑
  - - "6<9"
    - ⠼⠋⠔⠔⠼⠊
